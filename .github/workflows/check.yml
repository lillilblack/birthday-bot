name: Reply Check

on:
  schedule:
    # 每 30 分钟轮询一次新消息并回复。
    # 私有仓库免费额度 2000 分钟/月：每 5 分钟≈8640 分钟/月会超，每 30 分钟≈1440 分钟/月安全。
    # 回消息最多等半小时，对生日提醒场景够用。想更快可改成公开仓库（不限分钟）或 */15。
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # 与本机一致，避免版本漂移导致行为差异。
          bun-version: 1.3.14

      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: birthday-bot-runtime-${{ github.run_id }}
          restore-keys: |
            birthday-bot-runtime-

      - name: Install dependencies
        run: bun install

      - name: Check and reply
        run: bun run check
        env:
          # Secrets 不会自动注入进程环境，必须在 workflow 里显式映射。
          ILINK_TOKEN: ${{ secrets.ILINK_TOKEN }}
          TO_USER_ID: ${{ secrets.TO_USER_ID }}
          CONTEXT_TOKEN: ${{ secrets.CONTEXT_TOKEN }}
          BIRTHDAYS_JSON: ${{ secrets.BIRTHDAYS_JSON }}

      - name: Save runtime cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .runtime
          key: birthday-bot-runtime-${{ github.run_id }}
