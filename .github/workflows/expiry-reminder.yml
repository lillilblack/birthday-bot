name: Expiry Reminder

on:
  schedule:
    # 每 6 小时检查一次 context_token 是否接近过期（阈值 16 小时）。
    # 必须在 token 过期（约 24h）前发出提醒，6 小时间隔 + 16 小时阈值保证最晚 22h 提醒。
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore runtime cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: birthday-bot-runtime-${{ github.run_id }}
          restore-keys: |
            birthday-bot-runtime-

      - name: Install dependencies
        run: bun install

      - name: Check expiry and remind
        run: bun run check-expiry
        env:
          ILINK_TOKEN: ${{ secrets.ILINK_TOKEN }}
          TO_USER_ID: ${{ secrets.TO_USER_ID }}
          CONTEXT_TOKEN: ${{ secrets.CONTEXT_TOKEN }}

      - name: Save runtime cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .runtime
          key: birthday-bot-runtime-${{ github.run_id }}
